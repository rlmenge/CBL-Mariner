# This action checks that required kernel configs have not been removed or
# modified to an undesirable value.
name: Kernel Required Configs Check

on:
  push:
    branches: [tomls/base/main]
    paths:
      - 'base/comps/kernel/*.config'
  pull_request:
    branches: [tomls/base/main]
    paths:
      - 'base/comps/kernel/*.config'

jobs:
  check:
    name: Kernel configs check
    runs-on: ubuntu-latest

    steps:
      - name: Workflow trigger checkout
        uses: actions/checkout@v4

      - name: Get base commit for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "base_sha=$(git rev-parse origin/${{ github.base_ref }})" >> $GITHUB_ENV

      - name: Get base commit for Pushes
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin ${{ github.event.before }}
          echo "base_sha=${{ github.event.before }}" >> $GITHUB_ENV

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Get Python dependencies
        run: python3 -m pip install -r scripts/kernel_config_checker/requirements.txt

      - name: Check if config files changed
        run: |
          echo "Files changed: '$(git diff-tree --no-commit-id --name-only -r ${{ env.base_sha }} ${{ github.sha }})'"
          changed_configs=$(git diff-tree --diff-filter=d --no-commit-id --name-only -r ${{ env.base_sha }} ${{ github.sha }} | { grep "base/comps/kernel/.*\.config$" || test $? = 1; })
          echo "Files to validate: '${changed_configs}'"
          echo "updated_configs<<EOF" >> $GITHUB_ENV
          echo "${changed_configs}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run kernel config checking script
        if: ${{ env.updated_configs != '' }}
        run: |
          JSON_PATH="scripts/kernel_config_checker/kernel_configs_json/azl4-os-required-kernel-configs.json"

          failed=0
          holder="${{ env.updated_configs }}"
          for file in $holder; do
            # Determine architecture from filename (e.g., 6.18-aarch64-azl.config)
            if [[ "$file" == *"aarch64"* ]]; then
              arch="arm64"
            else
              arch="x86_64"
            fi

            echo "============================================"
            echo "Checking: ${file} (kernel=kernel, arch=${arch})"
            echo "============================================"

            if ! (cd scripts && python3 -m kernel_config_checker.check_config \
              "../${file}" \
              kernel_config_checker/kernel_configs_json/azl4-os-required-kernel-configs.json \
              "kernel" "${arch}"); then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "✗ One or more kernel config checks failed"
            exit 1
          fi
